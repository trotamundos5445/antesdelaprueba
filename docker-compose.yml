name: ayundantiaS1
services:
  app:
    build: ./app
    ports: 
      - "8080:3000"
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app123
      DB_NAME: ayundatiaS1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --su-mysql --connect --innodb_initialized || mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    healthcheck: 
    test: ["CMD-SHELL","curl -fsS http://localhost:8080/ && pgrep -f 'node' >/dev/null"]
      interval: 10s 
      timeout: 5s
      retries: 5
      start_period: 15s

    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http:127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db: 
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ayundantiaS1
      MARIADB_USER: app
      MARIADB_PASSWORD: app123

    volumes: 
      - datos-db:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
volumen: 
  datos-db: 

